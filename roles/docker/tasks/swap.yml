---
- name: Check swap status
  command: swapon --show
  register: swap_status
  changed_when: false

- name: Disable swap immediately
  command: swapoff -a
  when: swap_status.stdout != ''

- name: Disable the dphys-swapfile service (Raspberry PI)
  systemd:
    name: dphys-swapfile
    enabled: no
    state: stopped
  when: ansible_distribution == 'Debian' and ansible_architecture == 'armv7l' # Debian Raspberry PI

- name: Ensure dphys-swapfile configuration disables swapfile (Raspberry PI)
  lineinfile:
    path: /etc/dphys-swapfile
    regexp: '^CONF_SWAPSIZE='
    line: 'CONF_SWAPSIZE=0'
  notify: reboot
  when: ansible_distribution == 'Debian' and ansible_architecture == 'armv7l' # Debian Raspberry PI

- name: Ensure swap is turned off
  command: swapon --show
  register: swap_status
  failed_when: swap_status.stdout != ""
  changed_when: false